name: CI

on:
  push:
    branches: [main]
  pull_request:

# Las fechas del dominio se calculan en hora local: correr todo en hora de Argentina
env:
  TZ: America/Argentina/Buenos_Aires

jobs:
  checks:
    name: Tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm test
      - run: npm test --prefix server
      - run: npm run build

  e2e:
    name: E2E + accesibilidad (Playwright + axe)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse CI
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build
      - name: App (servidor Express de producción)
        run: npx --yes @lhci/cli@0.14 autorun --config=lighthouserc.json
      - name: Landing
        run: npx --yes @lhci/cli@0.14 autorun --config=lighthouserc.landing.json
