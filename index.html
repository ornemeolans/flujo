<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EAEAE6" />
    <script>
      // Aplica el tema antes del primer render (misma lógica que src/theme.js)
      (function () {
        var pref = null
        try { pref = localStorage.getItem('flujo-theme') } catch (e) {}
        var theme = pref || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1F23')
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flujo" />
    <meta name="description" content="Controlá billeteras, tarjetas en cuotas y préstamos con débito automático. App gratuita que funciona sin conexión." />
    <!-- Al compartir el link (LinkedIn, WhatsApp, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flujo" />
    <meta property="og:title" content="Flujo — Tus finanzas, claras" />
    <meta property="og:description" content="Billeteras, tarjetas en cuotas y préstamos con débito automático. Funciona sin conexión." />
    <meta property="og:url" content="https://flujo-app.up.railway.app/" />
    <meta property="og:image" content="https://flujo-app.up.railway.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Flujo — Control de gastos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
