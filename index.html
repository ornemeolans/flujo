<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EAEAE6" />
    <script>
      // Aplica el tema antes del primer render (misma lógica que src/theme.js)
      (function () {
        var pref = null
        try { pref = localStorage.getItem('flujo-theme') } catch (e) {}
        var theme = pref || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0E1F23')
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flujo" />
    <meta name="description" content="Controlá tus gastos, billeteras y tarjetas de crédito" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Flujo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
